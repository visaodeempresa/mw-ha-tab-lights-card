name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "hacs.json"
  workflow_dispatch:

jobs:
  auto-release:
    name: Bump, tag & release
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')"
    permissions:
      contents: write
    steps:
      - name: Checkout (histórico completo p/ tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          COMMITS=$(git log "${LAST}..HEAD" --pretty=%s 2>/dev/null || git log --pretty=%s)
          BUMP=patch
          echo "$COMMITS" | grep -qiE '(BREAKING|!:)' && BUMP=major || true
          [ "$BUMP" = "patch" ] && echo "$COMMITS" | grep -qiE '^feat' && BUMP=minor || true
          V=${LAST#v}; IFS=. read -r MA MI PA <<< "$V"
          case $BUMP in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            patch) PA=$((PA+1));;
          esac
          NEXT="v${MA}.${MI}.${PA}"
          echo "last=$LAST next=$NEXT bump=$BUMP"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Respeitar versão maior já escrita no dist
        id: keep
        run: |
          set -euo pipefail
          NEXT=${{ steps.ver.outputs.next }}
          CUR=$(grep -oE 'VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' dist/mw-tab-lights-card.js | head -1 \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          BIG=$(printf '%s\n%s\n' "${NEXT#v}" "$CUR" | sort -V | tail -1)
          echo "dist=$CUR calculada=${NEXT#v} escolhida=$BIG"
          echo "next=v$BIG" >> "$GITHUB_OUTPUT"

      - name: Sync version into dist + sanity
        run: |
          set -euo pipefail
          NEXT=${{ steps.keep.outputs.next }}
          sed -i -E "s/VERSION = \"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION = \"${NEXT#v}\"/" dist/mw-tab-lights-card.js
          grep -q "VERSION = \"${NEXT#v}\"" dist/mw-tab-lights-card.js
          node --check dist/mw-tab-lights-card.js
          node tools/probe.js

      - name: Commit version bump
        run: |
          set -euo pipefail
          if ! git diff --quiet dist/mw-tab-lights-card.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/mw-tab-lights-card.js
            git commit -m "chore: 🔖 ${{ steps.keep.outputs.next }} [skip release]"
            git push
          fi

      - name: Tag & publish release (asset + notas)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.keep.outputs.next }}
          name: ${{ steps.keep.outputs.next }}
          generate_release_notes: true
          files: dist/mw-tab-lights-card.js
